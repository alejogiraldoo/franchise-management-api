spring:
  application:
    name: Franchise System

  webflux:
    base-path: /franchise_system/api

  # R2DBC Connection
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:mysql://localhost:3306/franchise_system}
    username: ${SPRING_R2DBC_USERNAME:root}
    password: ${SPRING_R2DBC_PASSWORD:123456}
    # R2DBC Pool Connection
    pool:
      enabled: true
      initial-size: 15
      max-size: 30
      max-life-time: 30000
      max-idle-time: 20000
      max-create-connection-time: 10000
      validation-query: SELECT 1

#R2DBC Logging
logging:
  level:
    org:
      springframework:
        data:
          r2dbc: INFO
        transaction: INFO
    io:
      r2dbc:
        pool: INFO